name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20. `jsdom` -> `undici` needed a Node API that 20 did not
          # have, and every vitest file failed to *start* with an error naming
          # `cachestorage.js`. The environment is now `node`, which removes that
          # chain from the test path entirely, but the version stays current so
          # the next dependency to want a newer runtime says so at install time
          # rather than as five unhandled worker errors.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck` is `next typegen && tsc --noEmit`, and the first
      # half is not optional here. `LayoutProps<"/">` and its siblings are
      # *generated*, not shipped: Next writes them into `.next/types` during dev
      # or build, so a clean checkout fails with "Cannot find name 'LayoutProps'"
      # on a file that is perfectly correct locally. `typegen` writes them
      # without paying for a full build.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      # No environment variables are provided on purpose. Every page is
      # server-rendered on demand and the Upstash client is built lazily, so a
      # build that needs a secret is a bug worth failing on here rather than
      # discovering on Vercel.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20. `jsdom` -> `undici` needed a Node API that 20 did not
          # have, and every vitest file failed to *start* with an error naming
          # `cachestorage.js`. The environment is now `node`, which removes that
          # chain from the test path entirely, but the version stays current so
          # the next dependency to want a newer runtime says so at install time
          # rather than as five unhandled worker errors.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
